  <!-- The paired copies meet at the equirectangular seam, centered on vector (10, 0, 0). -->
  <use href="#gilded-inscription" transform="translate(0 512)" />
  <use href="#gilded-inscription" transform="translate(2048 512)" />
  <path d="M0 0h2048v1024H0Z" filter="url(#grain)" opacity=".7" />
</svg>
