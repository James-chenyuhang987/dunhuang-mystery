<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172b32" />
      <stop offset=".48" stop-color="#44313e" />
      <stop offset="1" stop-color="#192a30" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6e3c36" />
      <stop offset=".5" stop-color="#392f3d" />
      <stop offset="1" stop-color="#754635" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff09a" />
      <stop offset=".34" stop-color="#f8c84f" />
      <stop offset=".7" stop-color="#d99727" />
      <stop offset="1" stop-color="#ffe078" />
    </linearGradient>
    <pattern id="lattice" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M0 64 64 0l64 64-64 64Z" fill="none" stroke="#73918c" stroke-opacity=".42" stroke-width="3" />
      <circle cx="64" cy="64" r="17" fill="none" stroke="#be875a" stroke-opacity=".55" stroke-width="4" />
      <circle cx="64" cy="64" r="5" fill="#d0aa6b" fill-opacity=".62" />
    </pattern>
    <pattern id="script" width="76" height="92" patternUnits="userSpaceOnUse">
