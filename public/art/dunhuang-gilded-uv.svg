    </pattern>
    <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feFlood flood-color="#ffbc36" flood-opacity=".85" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix values=".22 0 0 0 0  0 .24 0 0 0  0 0 .3 0 0  0 0 0 .26 0" />
    </filter>
