      <circle r="76" fill="#3d2734" stroke="url(#gold)" stroke-width="9" filter="url(#goldGlow)" />
      <circle r="55" fill="none" stroke="#ffd969" stroke-width="4" stroke-dasharray="7 8" />
      <path d="M0-43 13-15 43 0 13 15 0 43-13 15-43 0-13-15Z" fill="url(#gold)" filter="url(#goldGlow)" />
