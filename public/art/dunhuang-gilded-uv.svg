        <path d="M88 91h76m-65 28h54m-61 31h70m-57-62v88m-18 0h84" />
      </g>
      <g fill="#ffe887" filter="url(#goldGlow)">
        <circle cx="-216" cy="-266" r="8" />
        <circle cx="216" cy="-266" r="8" />
        <circle cx="-216" cy="266" r="8" />
        <circle cx="216" cy="266" r="8" />
      </g>
    </g>
