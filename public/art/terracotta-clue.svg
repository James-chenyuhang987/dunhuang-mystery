    <path d="M24 58h330v68H24z" fill="url(#section)"/>
    <path d="M24 70h330M24 92h330M24 113h330" stroke="#f0b979" stroke-width="3" opacity=".42"/>
    <g font-family="sans-serif" font-size="16" fill="#4b3b32"><text x="20" y="30" font-weight="700">断面放大</text><text x="290" y="52">表层</text><text x="290" y="148">胎体</text></g>
    <path d="M282 48v31M282 139v-27" stroke="#315b5a" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(675 402)">
