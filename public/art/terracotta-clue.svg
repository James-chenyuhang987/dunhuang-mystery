    <rect x="18" y="18" width="138" height="125" fill="url(#armor)"/>
    <text x="87" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f0d6a5">甲衣压印纹</text>
  </g>
  <g transform="translate(879 402)">
    <rect width="174" height="180" rx="12" fill="#513a33" stroke="#ead2a5" stroke-width="5"/>
    <path d="M28 28q70 25 118 0M23 61q72 31 128 0M27 97q64 28 119 1M35 129q52 20 100 1" fill="none" stroke="#d49360" stroke-width="10" stroke-linecap="round"/>
    <text x="87" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#f0d6a5">衣褶刻划纹</text>
  </g>
  <g transform="translate(675 626)">
    <rect width="378" height="126" rx="12" fill="#ead2a5" stroke="#5c4035" stroke-width="5"/>
    <circle cx="50" cy="49" r="22" fill="#8d3f36"/><circle cx="116" cy="49" r="22" fill="#315b5a"/><circle cx="182" cy="49" r="22" fill="#cf9f49"/><circle cx="248" cy="49" r="22" fill="#2c2b2b"/>
    <path d="M288 34q35-19 65 6-26 25-63 35z" fill="#8d3f36" opacity=".48"/>
    <text x="20" y="105" font-family="sans-serif" font-size="16" fill="#4b3b32">残留色层仅作观察提示，不作复原依据</text>
  </g>
  <g fill="none" stroke="#315b5a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M435 264Q566 205 661 255"/><path d="M496 445q104 6 164 35"/><path d="M371 584q120 121 290 102"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="700" fill="#315b5a">
    <text x="515" y="224">观察颗粒与烧成层</text><text x="523" y="432">辨认成形工具痕</text><text x="443" y="657">记录色层位置</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#efe0bd"><text x="86" y="854">观察顺序：整体形状 → 表面纹理 → 断面层次 → 颜色残留 → 编号记录</text></g>
  <path d="M43 804h1114" stroke="#5d3d32" stroke-width="3" opacity=".5"/>
</svg>
