<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#c8b58a"/><path d="M65 80L732 52 701 425 90 444Z" fill="#dfcda3" stroke="#96774b" stroke-width="3"/><g fill="none" stroke="#92764d" stroke-width="2"><path d="M130 140H650M130 190H650M130 240H650M130 290H650M130 340H650"/></g><g font-family="serif" fill="#584e36" text-anchor="middle"><text x="400" y="119" font-size="26">沙州行记 · 残卷</text><text x="400" y="181" font-size="21">日落西山，驼铃向东。</text><text x="400" y="231" font-size="21">青石为记，循水而行。</text><text x="400" y="281" font-size="21">九色不为财，守诺胜黄金。</text><text x="400" y="331" font-size="21">经卷归匣，木签留名。</text></g><path d="M595 353H657V410H595Z" fill="none" stroke="#985140" stroke-width="3"/><text x="626" y="391" text-anchor="middle" font-family="serif" font-size="26" fill="#985140">印</text></svg>