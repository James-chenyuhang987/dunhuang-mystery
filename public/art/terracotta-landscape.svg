  <path d="M788 900c-25-143-13-245 37-310 47-62 135-74 213-93-57 52-115 99-105 174 9 68 69 131 116 229z" fill="#d6ae72" opacity=".82"/>
  <path d="M803 900c-18-133-9-228 36-287 30-39 72-62 122-84" fill="none" stroke="#f1d49b" stroke-width="4" stroke-dasharray="16 18" opacity=".7"/>
  <g transform="translate(70 745)" fill="#f0c884">
    <path d="M0 35h260v7H0zm0 70h260v7H0z" opacity=".75"/>
    <path d="M18 0h12v130H18zm72 0h12v130H90zm72 0h12v130h-12zm72 0h12v130h-12z" opacity=".65"/>
  </g>
  <g transform="translate(1195 668)">
