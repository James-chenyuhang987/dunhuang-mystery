    </g>
    <g opacity=".95">
      <use href="#warrior" x="92" y="37" width="28" height="70"/><use href="#warrior" x="150" y="45" width="28" height="70"/>
      <use href="#warrior" x="210" y="52" width="28" height="70"/><use href="#warrior" x="270" y="61" width="28" height="70"/>
      <use href="#warrior" x="332" y="69" width="28" height="70"/><use href="#warrior" x="394" y="77" width="28" height="70"/>
      <use href="#warrior" x="456" y="86" width="28" height="70"/><use href="#warrior" x="518" y="95" width="28" height="70"/>
    </g>
    <path d="M0 62v25l300 126 412-123V75L303 192z" fill="#6f4535" opacity=".65"/>
